[project]
name = "auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.3",
    "pydantic[email]>=2.13.1",
    "pyjwt>=2.12.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "ruff>=0.15.20",
    "vulture>=2.16",
]


[tool.vulture]
exclude = [
    ".venv/",
    "venv/",
    "migrations/",
    "__pycache__/",
    "build/",
    "dist/",
]
min_confidence = 80
